# SMS Gateway configuration
# See config.go for all available options

# Database
DB_DRIVER=sqlite
DB_DSN=/opt/sms-gateway/sms-gateway.db

# GSM modem serial device
DEVICE_PATH=/dev/ttyUSB2
BAUD_RATE=115200

# HTTP server listen address. 127.0.0.1 only accepts local connections (e.g.
# behind a reverse proxy); use 0.0.0.0 to accept connections on all interfaces.
HOST=127.0.0.1

# HTTP server port
PORT=5174

# JWT signing secret (required, at least 32 characters). Anyone who knows it can
# log in as admin. Generate one with: openssl rand -base64 32
JWT_SECRET=
