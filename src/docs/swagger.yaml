basePath: /api/v1
definitions:
  api.ATCatalogResponse:
    properties:
      commands:
        items:
          $ref: '#/definitions/modem.ATCommandInfo'
        type: array
      supported:
        description: |-
          Supported lists the command names the modem reported through AT+CLAC,
          or is null when the modem does not support that query.
        items:
          type: string
        type: array
    type: object
  api.HealthResponse:
    properties:
      database:
        type: string
      modem:
        type: string
      status:
        type: string
    type: object
  models.APIKey:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      key:
        description: Key is the plaintext key, set only in the response that creates
          it.
        type: string
      label:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.ATCommandRequest:
    properties:
      command:
        type: string
      confirm:
        description: Confirm must be true to run a dangerous or unrecognised command.
        type: boolean
    type: object
  models.ATCommandResponse:
    properties:
      response:
        type: string
    type: object
  models.ATConfirmationRequired:
    properties:
      error:
        type: string
      requires_confirmation:
        type: boolean
      risk:
        description: Risk is "dangerous" or "unknown".
        type: string
      title:
        description: Title names the recognised command, when there is one.
        type: string
      warning:
        type: string
    type: object
  models.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  models.ChangePasswordResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  models.Contact:
    properties:
      created_at:
        type: string
      name:
        type: string
      phone_number:
        type: string
      updated_at:
        type: string
    type: object
  models.ContactRequest:
    properties:
      name:
        example: Jane Doe
        type: string
    type: object
  models.Conversation:
    properties:
      contact_name:
        description: ContactName is the saved name for the number, empty when there
          is none.
        type: string
      last_message:
        $ref: '#/definitions/models.Message'
      message_count:
        type: integer
      phone_number:
        type: string
      unread_count:
        description: UnreadCount is the number of inbound messages still in "received"
          status.
        type: integer
    type: object
  models.ConversationUpdateResponse:
    properties:
      affected:
        type: integer
    type: object
  models.CreateAPIKeyRequest:
    properties:
      label:
        type: string
    type: object
  models.CreateAPIKeyResponse:
    properties:
      api_key:
        $ref: '#/definitions/models.APIKey'
    type: object
  models.CreateUserRequest:
    properties:
      is_admin:
        type: boolean
      password:
        type: string
      username:
        type: string
    type: object
  models.Direction:
    enum:
    - inbound
    - outbound
    type: string
    x-enum-varnames:
    - DirectionInbound
    - DirectionOutbound
  models.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.Message:
    properties:
      api_key_id:
        type: string
      body:
        type: string
      created_at:
        type: string
      direction:
        $ref: '#/definitions/models.Direction'
      error_message:
        type: string
      id:
        type: string
      modem_response:
        type: string
      phone_number:
        type: string
      status:
        $ref: '#/definitions/models.MessageStatus'
      updated_at:
        type: string
    type: object
  models.MessageStats:
    properties:
      by_status:
        additionalProperties:
          type: integer
        description: |-
          ByStatus is keyed "<direction>.<status>", e.g. "outbound.sent", so clients
          can read counts this struct does not name explicitly.
        type: object
      failed:
        type: integer
      inbound:
        type: integer
      outbound:
        type: integer
      pending:
        type: integer
      sent:
        type: integer
      total:
        type: integer
      unread:
        type: integer
    type: object
  models.MessageStatus:
    enum:
    - pending
    - sending
    - sent
    - failed
    - received
    - read
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusSending
    - StatusSent
    - StatusFailed
    - StatusReceived
    - StatusRead
  models.ModemSignalResponse:
    properties:
      quality:
        type: string
      signal:
        type: integer
    type: object
  models.ModemStatusResponse:
    properties:
      status:
        type: string
    type: object
  models.SendSMSRequest:
    properties:
      body:
        type: string
      to:
        description: |-
          To is an international number with + and country code (spaces, dashes,
          dots and parentheses are ignored) or a 3-6 digit short code.
        example: "+15551234567"
        type: string
    type: object
  models.SendSMSResponse:
    properties:
      id:
        type: string
      message:
        type: string
      status:
        $ref: '#/definitions/models.MessageStatus'
    type: object
  models.User:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      must_change_password:
        type: boolean
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.Webhook:
    properties:
      created_at:
        type: string
      events:
        items:
          $ref: '#/definitions/models.WebhookEvent'
        type: array
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      secret:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  models.WebhookEvent:
    enum:
    - message.received
    - message.sent
    - message.failed
    type: string
    x-enum-varnames:
    - EventMessageReceived
    - EventMessageSent
    - EventMessageFailed
  models.WebhookRequest:
    properties:
      events:
        items:
          $ref: '#/definitions/models.WebhookEvent'
        type: array
      is_active:
        type: boolean
      name:
        type: string
      secret:
        type: string
      url:
        type: string
    type: object
  modem.ATCommandInfo:
    properties:
      category:
        type: string
      description:
        type: string
      example:
        type: string
      forms:
        items:
          $ref: '#/definitions/modem.ATForm'
        type: array
      name:
        description: |-
          Name is the command as written after "AT": "+CSQ", "&F", "I", or ""
          for the bare AT attention command.
        type: string
      params:
        items:
          $ref: '#/definitions/modem.ATParam'
        type: array
      reference:
        type: string
      response:
        type: string
      risk:
        allOf:
        - $ref: '#/definitions/modem.ATRisk'
        description: |-
          Risk applies to the execute and set forms. Read and test forms never
          change anything and are always safe.
      title:
        type: string
      warning:
        type: string
    type: object
  modem.ATForm:
    properties:
      description:
        type: string
      kind:
        $ref: '#/definitions/modem.ATFormKind'
      syntax:
        type: string
    type: object
  modem.ATFormKind:
    enum:
    - execute
    - read
    - test
    - set
    type: string
    x-enum-comments:
      FormExecute: AT+CMD
      FormRead: AT+CMD?
      FormSet: AT+CMD=<args>, or ATE0 for basic commands
      FormTest: AT+CMD=?
    x-enum-descriptions:
    - AT+CMD
    - AT+CMD?
    - AT+CMD=?
    - AT+CMD=<args>, or ATE0 for basic commands
    x-enum-varnames:
    - FormExecute
    - FormRead
    - FormTest
    - FormSet
  modem.ATParam:
    properties:
      description:
        type: string
      name:
        type: string
      values:
        items:
          $ref: '#/definitions/modem.ATParamValue'
        type: array
    type: object
  modem.ATParamValue:
    properties:
      description:
        type: string
      value:
        type: string
    type: object
  modem.ATRisk:
    enum:
    - safe
    - config
    - dangerous
    - unknown
    type: string
    x-enum-varnames:
    - RiskSafe
    - RiskConfig
    - RiskDangerous
    - RiskUnknown
host: localhost:5174
info:
  contact: {}
  description: REST API for sending and receiving SMS messages via a USB GSM modem.
  license:
    name: GPL-3.0
  title: SMS Gateway API
  version: "1.0"
paths:
  /api/v1/apikeys:
    get:
      description: Returns API keys for the authenticated user, newest first. Admins
        see all keys.
      parameters:
      - description: Maximum keys to return (max 500). Omit to return all.
        in: query
        name: limit
        type: integer
      - description: Keys to skip. Only applied together with limit.
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Total matching keys is returned in the X-Total-Count header
          schema:
            items:
              $ref: '#/definitions/models.APIKey'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - API Keys
    post:
      consumes:
      - application/json
      description: Generates a new API key for the authenticated user with an optional
        label.
      parameters:
      - description: API key creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CreateAPIKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - API Keys
  /api/v1/apikeys/{id}:
    delete:
      description: Deactivates an API key by its unique identifier. Non-admins can
        only deactivate their own keys.
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: API key deactivated'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deactivate API key
      tags:
      - API Keys
  /api/v1/apikeys/{id}/delete:
    delete:
      description: Permanently deletes an API key by its unique identifier. Non-admins
        can only delete their own keys.
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: API key deleted'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete API key
      tags:
      - API Keys
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows an authenticated user to change their password by providing
        the current and new passwords. Every existing token is revoked; the response
        carries a new one for the caller.
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChangePasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with username and password, returning a JWT
        token.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: User login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes every token issued to the authenticated user, logging them
        out on all devices.
      produces:
      - application/json
      responses:
        "200":
          description: 'message: logged out'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Auth
  /api/v1/contacts:
    delete:
      description: Removes the saved name for a phone number. Messages are not affected.
      parameters:
      - description: Phone number of the contact
        in: query
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete contact name
      tags:
      - Contacts
    get:
      description: Returns saved contact names ordered by name.
      parameters:
      - description: Only contacts whose name or number contains this text
        in: query
        name: q
        type: string
      - description: Maximum contacts to return (max 500). Omit to return all.
        in: query
        name: limit
        type: integer
      - description: Contacts to skip. Only applied together with limit.
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Total matching contacts is returned in the X-Total-Count header
          schema:
            items:
              $ref: '#/definitions/models.Contact'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List contacts
      tags:
      - Contacts
    put:
      consumes:
      - application/json
      description: Sets the display name for a phone number, creating the contact
        if needed.
      parameters:
      - description: Phone number of the contact
        in: query
        name: phone
        required: true
        type: string
      - description: Contact name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ContactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Contact'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Save contact name
      tags:
      - Contacts
  /api/v1/health:
    get:
      description: Checks database connectivity and modem status, returning the overall
        system health.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.HealthResponse'
      summary: Health check
      tags:
      - Health
  /api/v1/modem/at:
    post:
      consumes:
      - application/json
      description: Sends a raw AT command to the GSM modem and returns the response.
        Requires admin privileges.
      parameters:
      - description: AT command to send
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ATCommandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ATCommandResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Dangerous or unrecognised command sent without confirm
          schema:
            $ref: '#/definitions/models.ATConfirmationRequired'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send AT command
      tags:
      - Modem
  /api/v1/modem/at/commands:
    get:
      description: Returns documentation for common AT commands, with the risk of
        running each, and the command names the modem reports through AT+CLAC (null
        when unsupported). Requires admin privileges.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ATCatalogResponse'
      security:
      - BearerAuth: []
      summary: AT command reference
      tags:
      - Modem
  /api/v1/modem/signal:
    get:
      description: Returns the GSM modem signal strength and quality assessment.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ModemSignalResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get modem signal strength
      tags:
      - Modem
  /api/v1/modem/status:
    get:
      description: Checks whether the GSM modem is responsive and returns its current
        status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ModemStatusResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.ModemStatusResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get modem status
      tags:
      - Modem
  /api/v1/sms/{id}:
    delete:
      description: Deletes a single SMS message by its unique identifier.
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete message
      tags:
      - SMS
    get:
      description: Returns a single SMS message by its unique identifier.
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get message by ID
      tags:
      - SMS
  /api/v1/sms/{id}/read:
    put:
      description: Marks an inbound message as read, changing its status from "received"
        to "read".
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Mark message as read
      tags:
      - SMS
  /api/v1/sms/{id}/unread:
    put:
      description: Marks an inbound message as unread, changing its status from "read"
        back to "received".
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Mark message as unread
      tags:
      - SMS
  /api/v1/sms/conversations:
    delete:
      description: Deletes every inbound and outbound message for the phone number.
      parameters:
      - description: Phone number of the conversation
        in: query
        name: phone
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ConversationUpdateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
